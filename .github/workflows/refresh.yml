name: Refresh scores

on:
  schedule:
    # Cron times are UTC. Pacific is UTC-7 in PDT (Mar–Nov) and UTC-8 in PST, so in winter
    # each run lands an hour earlier in Pacific time than the comments below.
    - cron: "0 20 * * 6,0"   # Sat & Sun ~1 pm Pacific
    - cron: "0 0,4 * * 0,1"  # Sat & Sun ~5 pm and ~9 pm Pacific (next day in UTC)
    - cron: "0 16 * * 1,2"   # Mon & Tue ~9 am Pacific, for late-entered scores
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch latest data and rebuild
        run: python3 scripts/refresh.py
      - name: Publish if scores or schedule changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/games.csv)" ]; then
            echo "No new scores or schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh scores ($(TZ=America/Los_Angeles date +%Y-%m-%d))"
          git push
          # Pushes made with the workflow token may not trigger a Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      # Runs after publishing on purpose: the new scores still go live, but if the dashboard's tables stop matching
      # MLS's official standings (a feed change or a new data quirk), this step fails and GitHub emails a warning.
      - name: Check tables against MLS's official standings
        run: |
          set +e  # keep going after a failed check so the summary is still written
          python3 scripts/check_official.py > check.txt
          status=$?
          cat check.txt
          { echo '### Official standings check'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
